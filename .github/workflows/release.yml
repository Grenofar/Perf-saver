name: Release

# Une release est publiée automatiquement quand la version de src-tauri/Cargo.toml
# change sur main (ou manuellement via « Run workflow »).
on:
  push:
    branches: [main]
    paths: ["src-tauri/**", "ui/**", "installer/**", "build.sh", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release v$VERSION existe déjà : build seulement."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Outils de compilation (mingw-w64, NSIS, Rust)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis zip
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Compilation + installeur
        run: ./build.sh

      - name: Publication de la release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Perf Saver ${{ steps.v.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/PerfSaver-Setup-*.exe
            dist/PerfSaver-portable-*.zip
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: perfsaver-windows-${{ steps.v.outputs.version }}
          path: dist/
