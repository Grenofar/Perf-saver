<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#ededed;-webkit-font-smoothing:antialiased;user-select:none}
.card{position:absolute;inset:4px;background:rgba(26,26,26,.97);border:1px solid #3b3b3b;border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:8px}
.top svg{flex:none}
.t{font-weight:600;flex:1}
.x{background:none;border:0;color:#8a8a8a;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px}
.x:hover{color:#fff;background:#333}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#232323;border:1px solid #333;border-radius:8px;padding:6px 8px}
.stat .lbl{color:#9a9a9a;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-weight:700;font-size:15px}
.stat .val small{font-weight:500;font-size:10.5px;color:#9a9a9a}
canvas{display:block;width:100%;height:84px;border-radius:6px;background:#1c1c1c}
.legend{display:flex;gap:12px;font-size:11px;color:#a3a3a3}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
button.go{font:inherit;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:6px;border:1px solid #ededed;background:#ededed;color:#141414;cursor:pointer}
button.go:hover{background:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <svg width="18" height="18" viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="14" fill="#2b2b2b"/><path d="M14.5 44A21 21 0 1 1 49.5 44" fill="none" stroke="#555" stroke-width="5.5" stroke-linecap="round"/><path d="M14.5 44A21 21 0 0 1 46.3 17.0" fill="none" stroke="#5b9bd5" stroke-width="5.5" stroke-linecap="round"/><path d="M32 37 43 24" stroke="#ededed" stroke-width="4.5" stroke-linecap="round"/><circle cx="32" cy="37" r="4.6" fill="#ededed"/></svg>
    <div class="t">Perf Saver</div>
    <button class="x" id="x" title="Fermer (Alt+P)">×</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="lbl">CPU</div><div class="val" id="vCpu">--%</div></div>
    <div class="stat"><div class="lbl">RAM</div><div class="val" id="vRam">--%</div></div>
    <div class="stat" id="gpuStat"><div class="lbl">GPU</div><div class="val" id="vGpu">--%</div></div>
  </div>
  <canvas id="graph" width="540" height="168"></canvas>
  <div class="legend">
    <span><i class="dot" style="background:#5b9bd5"></i>CPU</span>
    <span id="legGpu"><i class="dot" style="background:#9a9a9a"></i>GPU</span>
  </div>
  <button class="go" id="open">Ouvrir Perf Saver</button>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const $ = id => document.getElementById(id);
const MAX_POINTS = 30; // ~60 s à 2 s d'intervalle
const cpuHist = [];
const gpuHist = [];
let hasGpu = false;
let timer = null;

const canvas = $("graph");
const ctx = canvas.getContext("2d");

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  // repères horizontaux discrets
  ctx.strokeStyle = "#2c2c2c";
  ctx.lineWidth = 1;
  for (const frac of [0.25, 0.5, 0.75]) {
    const y = h - frac * h;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  const line = (hist, color, dashed) => {
    if (hist.length < 2) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.setLineDash(dashed ? [5, 4] : []);
    ctx.beginPath();
    hist.forEach((v, i) => {
      const x = (i / (MAX_POINTS - 1)) * w;
      const y = h - (Math.min(100, Math.max(0, v)) / 100) * h;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
  };
  line(cpuHist, "#5b9bd5", false);
  if (hasGpu) line(gpuHist, "#9a9a9a", true);
}

function push(hist, v) {
  hist.push(v);
  while (hist.length > MAX_POINTS) hist.shift();
}

async function tick() {
  try {
    const snap = await invoke("get_snapshot");
    $("vCpu").textContent = Math.round(snap.cpu) + "%";
    const ramPct = snap.ram_total_mb > 0 ? (snap.ram_used_mb / snap.ram_total_mb) * 100 : 0;
    $("vRam").textContent = Math.round(ramPct) + "%";
    push(cpuHist, snap.cpu);
    hasGpu = !!snap.gpu;
    $("gpuStat").style.display = hasGpu ? "" : "none";
    $("legGpu").style.display = hasGpu ? "" : "none";
    if (hasGpu) {
      $("vGpu").textContent = Math.round(snap.gpu.util3d) + "%";
      push(gpuHist, snap.gpu.util3d);
    }
    draw();
  } catch (e) {}
}

function start() {
  if (timer) return;
  tick();
  timer = setInterval(tick, 2000);
}
function stop() {
  if (timer) { clearInterval(timer); timer = null; }
}

$("open").onclick = () => invoke("hud_action", { action: "open" });
$("x").onclick = () => invoke("hud_action", { action: "close" });

window.__TAURI__.event.listen("hud-visible", e => { e.payload ? start() : stop(); });
start();
</script>
</body>
</html>
