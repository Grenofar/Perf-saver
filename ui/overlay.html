<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#ededed;-webkit-font-smoothing:antialiased;user-select:none}
.card{position:absolute;inset:4px;background:rgba(32,32,32,.97);border:1px solid #3b3b3b;border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;gap:10px}
.logo{position:relative;width:26px;height:26px;flex:none}
.logo img,.logo svg{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;object-fit:cover}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:#a3a3a3;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{margin-left:auto;background:none;border:0;color:#8a8a8a;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px}
.x:hover{color:#fff;background:#333}
.btns{display:flex;gap:8px}
button.b{flex:1;font:inherit;font-size:12.5px;padding:6px 10px;border-radius:6px;border:1px solid #3b3b3b;background:#2b2b2b;color:#ededed;cursor:pointer}
button.b:hover{background:#333}
button.b.pri{background:#ededed;color:#141414;border-color:#ededed;font-weight:600}
#game{display:none}
.timer{position:absolute;left:0;bottom:0;height:2px;background:#5b9bd5;width:100%;animation:t 5s linear forwards}
@keyframes t{to{width:0}}
.card:hover .timer{animation-play-state:paused}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <span class="logo">
      <svg id="fallback" viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="14" fill="#2b2b2b"/><path d="M14.5 44A21 21 0 1 1 49.5 44" fill="none" stroke="#555" stroke-width="5.5" stroke-linecap="round"/><path d="M14.5 44A21 21 0 0 1 46.3 17.0" fill="none" stroke="#ededed" stroke-width="5.5" stroke-linecap="round"/><path d="M32 37 43 24" stroke="#ededed" stroke-width="4.5" stroke-linecap="round"/><circle cx="32" cy="37" r="4.6" fill="#ededed"/></svg>
      <img id="img" alt="" style="display:none">
    </span>
    <div style="min-width:0;flex:1">
      <div class="t" id="t">Jeu détecté</div>
      <div class="s" id="s" style="display:none"></div>
    </div>
    <button class="x" id="x" title="Fermer">×</button>
  </div>
  <div class="btns">
    <button class="b pri" id="open">Optimiser</button>
    <button class="b" id="game">Mettre à jour</button>
  </div>
  <div class="timer" id="timer"></div>
</div>
<script>
const invoke = window.__TAURI__.core.invoke;
const act = a => invoke("overlay_action", { action: a });
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);

if (q.get("kind") === "update") {
  $("t").textContent = "Perf Saver " + (q.get("v") || "") + " est disponible";
  $("s").textContent = "Installe la mise à jour en un clic.";
  $("s").style.display = "block";
  $("open").textContent = "Plus tard";
  $("game").textContent = "Mettre à jour";
  $("game").style.display = "block";
  $("timer").style.animationDuration = "12s";
  $("open").onclick = () => act("close");
  $("game").onclick = () => act("update");
} else {
  const game = q.get("game") || "";
  $("t").textContent = game || "Jeu détecté";
  $("open").textContent = "Optimiser";
  $("open").onclick = () => act("open");
  const exe = q.get("exe") || "";
  if (exe) {
    invoke("game_icon", { exe }).then(src => {
      if (src) {
        $("img").src = src;
        $("img").style.display = "block";
        $("fallback").style.display = "none";
      }
    }).catch(() => {});
  }
}
$("x").onclick = () => act("close");
// Disparaît après 5 s (la minuterie se met en pause au survol)
$("timer").addEventListener("animationend", () => act("close"));
</script>
</body>
</html>
